<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div class="app" id="app">
  <div class="left">
    <nav class="rail" id="rail" aria-label="Groups"></nav>
    <aside class="side">
      <h2 id="gname"></h2>
      <div class="code">Invite code: <b id="gcode"></b></div>
      <div class="chs" id="chs"></div>
      <div class="me"><span class="av" style="background:#ffb547">Y</span>you<button id="theme">Light mode</button></div>
    </aside>
  </div>
  <main class="main">
    <header class="top">
      <button class="nav" id="navbtn" aria-label="Open groups">Menu</button>
      <h1 id="cname"></h1><span class="sp"></span>
      <button id="membtn">Members</button>
    </header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="typing" id="typing"></div>
    <div class="cmp"><input id="inp" placeholder="Message this channel" aria-label="Message" autocomplete="off"><button id="send">Send</button></div>
  </main>
  <aside class="mem" id="mem"><h3>Members</h3><div id="memlist"></div></aside>
  <div class="scrim" id="scrim"></div>
</div>
<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="rt">
<h2 id="rt">Report message</h2>
<p class="sub">Reports go to the group admins, not to the person you report.</p>
<div class="quote"><b id="rwho"></b><span id="rtxt"></span></div>
<fieldset><legend>What’s the problem?</legend><div id="rreasons"></div></fieldset>
<label class="lb" for="rdesc">What was offensive or harmful about it?</label>
<textarea id="rdesc" maxlength="500" placeholder="Explain what was said or done and why it broke the rules. Add context if the message alone isn’t clear."></textarea>
<p class="hint" id="rhint"></p>
<label class="blk"><input type="checkbox" id="rblock"> Also block this person</label>
<div class="row"><button class="cancel" id="rcancel">Cancel</button><button class="go" id="rgo" disabled>Send report</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
